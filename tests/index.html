<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Korea Finder Automated Test Suite</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 24px; color: #0f172a; background: #f8fafc; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    #summary { padding: 12px 16px; border-radius: 10px; font-weight: 700; margin-bottom: 16px; }
    #summary.pass { background: #d1fae5; color: #065f46; }
    #summary.fail { background: #fee2e2; color: #991b1b; }
    ul { list-style: none; padding: 0; margin: 0 0 24px; display: flex; flex-direction: column; gap: 6px; }
    li { padding: 8px 12px; border-radius: 8px; background: #fff; border: 1px solid #e2e8f0; font-size: 13px; }
    li.pass { border-left: 4px solid #10b981; }
    li.fail { border-left: 4px solid #ef4444; background: #fef2f2; }
    #fixture { padding: 16px; border: 1px dashed #cbd5e1; border-radius: 10px; background: #fff; }
  </style>
</head>
<body>
  <h1>Korea Finder Automated Test Suite</h1>
  <div id="summary">실행 중...</div>
  <ul id="results"></ul>
  <div id="fixture"></div>

  <script src="../src/shared/constants.js"></script>
  <script src="../src/shared/storage.js"></script>
  <script src="../src/shared/shortcut.js"></script>
  <script src="../src/shared/matcher.js"></script>
  <script src="../src/content/toast.js"></script>
  <script src="../src/content/domFinder.js"></script>
  <script src="test-suite.js"></script>
</body>
</html>
