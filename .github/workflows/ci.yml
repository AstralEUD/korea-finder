name: CI Checks & Windows Validation

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-package-ubuntu:
    name: Test & Package Check (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run automated test suite & manifest checks
        run: npm test

      - name: Build multi-browser packages
        run: npm run package

      - name: Verify generated packages
        run: |
          ls -lh dist/
          for f in dist/*.zip dist/*.xpi; do
            unzip -t "$f" > /dev/null
          done
          (cd dist && sha256sum -c SHA256SUMS.txt)

  windows-powershell-package:
    name: PowerShell Packager Check (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Windows PowerShell packager
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package.ps1 -Target all
          Get-ChildItem dist | Format-Table Name, Length
