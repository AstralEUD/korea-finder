name: Release Multi-Browser Packages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.4.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run automated test suite
        run: npm test

      - name: Package all browser targets
        run: npm run package

      - name: Extract version and verify checksums
        id: vars
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          ls -lh dist/

      - name: Create or Update GitHub Release with Zip Archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || steps.vars.outputs.TAG }}
          name: Korea Finder v${{ steps.vars.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/korea-finder-v*-chrome.zip
            dist/korea-finder-v*-edge.zip
            dist/korea-finder-v*-firefox.zip
            dist/korea-finder-v*-firefox.xpi
            dist/korea-finder-v*-whale.zip
            dist/SHA256SUMS.txt
